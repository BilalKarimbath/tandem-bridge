name: Tests
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Source-only suite (no site packages)
        run: python -S -m unittest discover -s tests -v
      - run: python -m pip install -r requirements.txt
      - name: Full suite including schema parity oracles
        run: python -m unittest discover -s tests -v
      - name: Install build tooling for CI only
        run: python -m pip install build
      - name: Build and test module-only wheel in a disposable runner environment
        run: python tests/ci_wheel.py
